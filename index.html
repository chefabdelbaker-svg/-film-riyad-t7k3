<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="Film de présentation">
<meta property="og:description" content="Confidentiel">
<meta property="og:url" content="https://chefabdelbaker-svg.github.io/-film-riyad-t7k3/">
<meta property="og:image" content="https://chefabdelbaker-svg.github.io/-film-riyad-t7k3/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://chefabdelbaker-svg.github.io/-film-riyad-t7k3/preview.jpg">
<title>Film de présentation</title>
<style>
  :root{--gold:#c9a45c;--bg:#0b0b0c}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:Georgia,'Times New Roman',serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0}
  .frame{width:min(100vw,calc((100vh - 34px)*16/9));aspect-ratio:16/9;background:#000}
  video{width:100%;height:100%;display:block;background:#000}
  .langs{display:flex;gap:4px;height:28px;align-items:center}
  button{background:transparent;color:#777;border:0;padding:4px 12px;font-size:12px;letter-spacing:.14em;cursor:pointer;font-family:inherit;transition:.2s}
  button:hover{color:var(--gold)}
  button.on{color:var(--gold);border-bottom:1px solid var(--gold)}
  .note{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="frame"><video id="v" poster="preview.jpg" controls playsinline preload="metadata" controlsList="nodownload" oncontextmenu="return false"></video></div>
  <div class="langs">
    <button data-l="fr" class="on">FRANÇAIS</button>
    <button data-l="en">ENGLISH</button>
    <button data-l="ar" dir="rtl">العربية</button>
  </div>
  <div class="note">Confidentiel</div>
</div>
<script>
var B="https://d2ol7oe51mr4n9.cloudfront.net/user_3D21VIDvQO6GQiebCPHkrkl9cVl/";
var S={fr:B+"7c246c09-221c-4a4b-b934-4b1d33312fdf.mp4",
       en:B+"c800bd5b-16dd-47fe-940f-9585111bb011.mp4",
       ar:B+"54fe4a84-553b-45ea-8c3e-b3922d492c2b.mp4"};
var v=document.getElementById("v"),bs=document.querySelectorAll("button");
function set(l,play){
  bs.forEach(function(b){b.classList.toggle("on",b.dataset.l===l)});
  v.src=S[l]; v.load(); if(play){var p=v.play(); if(p&&p.catch)p.catch(function(){})}
  try{history.replaceState(null,"","#"+l)}catch(e){}
}
bs.forEach(function(b){b.onclick=function(){set(b.dataset.l,true)}});
var h=(location.hash||"").slice(1); set(S[h]?h:"fr",false);
</script>
</body>
</html>
